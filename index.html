<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Анастасия Струкова</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗝️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14181F;
    --bg-soft: #1B212B;
    --ink: #F3EFE6;
    --ink-dim: #A9A8A2;
    --line: #2B323E;
    --accent: #D9A441;
    --accent-dark: #B5832B;
    --font-display: 'PT Serif', Georgia, 'Times New Roman', serif;
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  * { box-sizing: border-box; }

  html {
    scroll-padding-top: env(safe-area-inset-top, 0px);
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    min-height: 100%;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 8vh 6vw;
    position: relative;
    overflow: hidden;
  }

  .wrap::before {
    content: "";
    position: absolute;
    top: -20%;
    right: -10%;
    width: 60vw;
    height: 60vw;
    max-width: 700px;
    max-height: 700px;
    background: radial-gradient(circle, rgba(217,164,65,0.08) 0%, rgba(217,164,65,0) 70%);
    pointer-events: none;
  }

  main {
    position: relative;
    max-width: 560px;
    width: 100%;
    text-align: center;
  }

  .eyebrow {
    font-family: var(--font-body);
    font-size: 0.8rem;
    letter-spacing: 0.02em;
    color: var(--ink-dim);
    margin: 0 0 1.75rem;
  }

  h1 {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: clamp(2.6rem, 9vw, 4.4rem);
    line-height: 1.05;
    margin: 0;
    letter-spacing: -0.01em;
  }

  h1 em {
    font-style: italic;
    color: var(--accent);
  }

  .rule {
    width: 48px;
    height: 2px;
    background: var(--accent);
    border: none;
    margin: 1.9rem auto;
  }

  p.lead {
    font-size: 1.1rem;
    line-height: 1.6;
    color: var(--ink);
    max-width: 30ch;
    margin: 0 auto 0.9rem;
  }

  p.sub {
    font-size: 1rem;
    line-height: 1.6;
    color: var(--ink-dim);
    max-width: 34ch;
    margin: 0 auto 2.6rem;
  }

  .cta {
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    background: var(--accent);
    color: #14181F;
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 1rem;
    text-decoration: none;
    padding: 0.95rem 1.9rem;
    border-radius: 999px;
    transition: background 0.2s ease, transform 0.2s ease;
  }

  .cta:hover { background: var(--accent-dark); }
  .cta:active { transform: scale(0.98); }
  .cta:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 3px;
  }

  .cta svg { width: 18px; height: 18px; flex-shrink: 0; }

  footer {
    position: absolute;
    bottom: calc(3.5vh + env(safe-area-inset-bottom, 0px));
    left: 0;
    right: 0;
    text-align: center;
    font-size: 0.78rem;
    color: #5B6270;
  }

  @media (max-width: 420px) {
    p.lead, p.sub { max-width: 28ch; }
  }

  @media (prefers-reduced-motion: reduce) {
    .cta { transition: none; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <main>
      <p class="eyebrow">предприниматель</p>
      <h1>Анастасия<br><em>Струкова</em></h1>
      <hr class="rule">
      <p class="lead">Говорю честно — без глянца и без мотивационного пафоса.</p>
      <p class="sub">Про бизнес, ошибки и то, почему рост не всегда про дисциплину.</p>
      <a class="cta" href="https://t.me/+is2pLFy-IMM4MTFi" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21.05 3.64 2.63 10.8c-1.25.5-1.24 1.2-.23 1.5l4.72 1.47 1.8 5.6c.22.6.37.84.76.84.3 0 .43-.13.6-.3l1.65-1.6 3.44 2.53c.63.35 1.08.17 1.24-.58l2.25-10.6c.24-.93-.35-1.35-1.01-1.07Z"/></svg>
        Подписаться в Telegram
      </a>
    </main>
    <footer>Канал Анастасии Струковой</footer>
  </div>
</body>
</html>
